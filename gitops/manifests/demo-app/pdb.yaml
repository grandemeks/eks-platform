apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-app
  namespace: demo
spec:
  # Applies to voluntary disruptions only: node drains during a cluster
  # upgrade, or a node group rollout. It tells the eviction API that it may
  # never take the deployment below one running pod, so an upgrade proceeds
  # one node at a time instead of draining both at once.
  #
  # minAvailable rather than maxUnavailable: with two replicas the two are
  # equivalent today, but minAvailable keeps its meaning if the replica count
  # changes.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app