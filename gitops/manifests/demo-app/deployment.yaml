apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-app
spec:
  replicas: 2

  # Two replicas exist so a rollout, a node drain or a spot reclaim never takes
  # the service to zero. maxUnavailable: 0 means the new pod must be Ready
  # before an old one is removed, so capacity never dips below two mid-rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      # The application talks to Postgres and to nothing in the AWS API, so its
      # service account needs no IRSA role and no projected token. Mounting one
      # anyway would hand every process in the pod a credential it has no use
      # for.
      serviceAccountName: demo-app
      automountServiceAccountToken: false

      # Must exceed the application's own shutdown sequence: five seconds of
      # failing readiness plus up to fifteen seconds of draining. At the
      # default thirty this fits; drop it below twenty and the kubelet sends
      # SIGKILL mid-drain and in-flight requests die.
      terminationGracePeriodSeconds: 30

      # Spread replicas across nodes. Preferred rather than required, because
      # with two nodes and two replicas a required constraint would leave the
      # second pod Pending during a node replacement.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-app

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          # Patched by CI via `kustomize edit set image`; see kustomization.yaml.
          image: demo-app:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: demo-app-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: demo-app-db
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: demo-app-db
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: demo-app-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-app-db
                  key: password

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Memory is limited because it is incompressible: a leaking pod
              # would otherwise take its neighbours down with it, and an OOM
              # kill of one container is better than an evicted node.
              memory: 128Mi
              # CPU is deliberately NOT limited. A CPU limit is enforced by CFS
              # quota, which throttles the process for the rest of a 100ms
              # period once the quota is spent — producing tail latency that
              # looks like an application problem and is not. The request
              # already guarantees a share under contention, which is what
              # actually matters. This is a considered choice, not an omission.

          # Liveness answers "is this process broken beyond recovery". It does
          # not touch the database: if it did, a database outage would restart
          # every replica and turn a recoverable dependency failure into a
          # self-inflicted one.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness answers "should this pod get traffic right now". The
          # database check belongs here: an unready pod leaves the load
          # balancer without being killed, and rejoins on its own.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # A separate startup probe means liveness does not begin evaluating
          # until the process is actually up. Without it, slow startup under
          # load looks like a liveness failure and the pod restarts forever.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15