apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    # Pod Security Admission. "restricted" is the strictest built-in profile:
    # it rejects privileged containers, host namespaces, privilege escalation
    # and containers that do not drop all capabilities.
    #
    # enforce blocks non-compliant pods outright. audit and warn are set to the
    # same level so that if enforce ever has to be relaxed, violations still
    # appear in the audit log and on kubectl output rather than going silent.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

    app.kubernetes.io/part-of: eks-platform