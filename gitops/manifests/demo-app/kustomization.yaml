apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

# Applied to every resource above. includeSelectors is false on purpose: the
# selector of a Deployment is immutable after creation, so a label transformer
# that reaches into it makes any future change to this list a breaking one.
labels:
  - pairs:
      app.kubernetes.io/part-of: eks-platform
    includeSelectors: false

# The image tag lives here rather than in the Deployment. CI runs
#   kustomize edit set image demo-app=<ecr-url>@sha256:<digest>
# and commits the result, which is the entire GitOps handoff: the pipeline
# changes one line in Git, and Argo CD reconciles the cluster to match.
#
# Deploying by digest rather than tag means the running workload is pinned to
# exact bytes that can be verified against a signature.
images:
  - name: demo-app
    newName: demo-app
    newTag: latest