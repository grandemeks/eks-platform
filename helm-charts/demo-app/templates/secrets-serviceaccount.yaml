{{- if .Values.externalSecret.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecret.serviceAccountName }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  annotations:
    # Only External Secrets uses this. The app's own SA carries no AWS identity.
    eks.amazonaws.com/role-arn: {{ required "externalSecret.roleArn must be set" .Values.externalSecret.roleArn }}
{{- end }}