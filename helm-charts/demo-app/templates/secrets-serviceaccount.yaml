{{- if .Values.externalSecret.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecret.serviceAccountName }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  annotations:
    # This service account exists only to be impersonated by External Secrets
    # when it reads AWS. The application's own service account deliberately
    # carries no AWS identity, so a compromised application pod cannot reach
    # Secrets Manager even though a secret-reading identity exists beside it.
    eks.amazonaws.com/role-arn: {{ required "externalSecret.roleArn must be set" .Values.externalSecret.roleArn }}
{{- end }}