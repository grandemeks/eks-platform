{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "demo-app.fullname" . }}-aws
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
      auth:
        # IRSA, so no key material anywhere. Namespaced rather than a
        # ClusterSecretStore, which would expose this identity to every namespace.
        jwt:
          serviceAccountRef:
            # No namespace field: the webhook rejects cross-namespace references.
            name: {{ .Values.externalSecret.serviceAccountName }}
{{- end }}