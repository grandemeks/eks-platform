{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "demo-app.fullname" . }}-aws
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
      auth:
        # jwt with a service account reference is IRSA: the operator requests a
        # projected token for that service account and exchanges it for
        # temporary AWS credentials. No key material exists anywhere.
        #
        # A namespaced SecretStore rather than a ClusterSecretStore, so this
        # namespace can only reach the secrets its own store defines. A cluster
        # store would make one AWS identity reachable from every namespace.
        jwt:
          serviceAccountRef:
            # No namespace field. A namespaced SecretStore may only reference a
            # service account in its own namespace — the admission webhook
            # rejects anything else — and that restriction is the isolation
            # boundary, not an inconvenience.
            name: {{ .Values.externalSecret.serviceAccountName }}
{{- end }}