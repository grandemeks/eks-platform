{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-app.fullname" . }}-dashboard
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
    # The Grafana sidecar loads ConfigMaps with this label from any namespace.
    grafana_dashboard: "1"
data:
  # Files.Get, not inlined: Grafana legend formats use Helm's own delimiters and
  # the render fails. Applies to comments here too, which are template source.
  demo-app.json: |
{{ .Files.Get "dashboards/demo-app.json" | indent 4 }}
{{- end }}