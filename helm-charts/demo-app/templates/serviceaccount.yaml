{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "demo-app.serviceAccountName" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
# No IRSA annotation: this workload calls no AWS API. The database credential
# arrives as a Kubernetes Secret that External Secrets syncs using its own
# identity, so the application never holds AWS permissions of any kind.
automountServiceAccountToken: false
{{- end }}