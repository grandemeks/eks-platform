{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "demo-app.fullname" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  annotations:
    # Public subnets, found through the kubernetes.io/role/elb tags on the VPC.
    alb.ingress.kubernetes.io/scheme: internet-facing

    # Pod IPs in the target group, so the ALB drains the individual pod on shutdown.
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn must be set" .Values.ingress.certificateArn }}
    # TLS 1.3 with 1.2 fallback. The older policies still allow 1.0 and 1.1.
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06

    # /healthz, not /readyz. The controller already reflects readiness into the
    # target group; checking both fails a pod at two layers with different timings.
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '10'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'

    # 15s must stay under terminationGracePeriodSeconds (30s), or the ALB drains
    # a target the kubelet has already killed.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15

    # Shares one ALB across Ingresses instead of one each at $0.023/h.
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.group }}

    # Terraform never learns the ALB's DNS name; external-dns closes the loop.
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.host }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "demo-app.fullname" . }}
                port:
                  name: http
{{- end }}