apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-app.fullname" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  # maxUnavailable: 0 keeps capacity at replicaCount through a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      {{- include "demo-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "demo-app.labels" . | nindent 8 }}
      annotations:
        # Env is read once at start, so a rotated credential needs a pod roll.
        checksum/db-secret: {{ printf "%s-%s" .Values.externalSecret.remoteSecretName (.Values.image.digest | default .Values.image.tag) | sha256sum }}
    spec:
      serviceAccountName: {{ include "demo-app.serviceAccountName" . }}

      # No Kubernetes API calls from this workload.
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      # ScheduleAnyway, not DoNotSchedule: with 2 nodes and 2 replicas the strict
      # form leaves a pod Pending during node replacement.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "demo-app.selectorLabels" . | nindent 14 }}

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: {{ include "demo-app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.externalSecret.enabled }}
            # Not sensitive, so a host change is a values change, not a rotation.
            - name: DB_HOST
              value: {{ required "database.host must be set" .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.database.sslMode | quote }}

            # Credential only, synced from Secrets Manager by External Secrets.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "demo-app.fullname" . }}-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "demo-app.fullname" . }}-db
                  key: password
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # /healthz must not touch the database, or an outage restarts every replica.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # /readyz does check it, so the pod leaves the ALB without being killed.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # 30s of startup budget before liveness applies.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15