{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "demo-app.fullname" . }}-db
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  # Each refresh is a billed Secrets Manager call.
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}

  secretStoreRef:
    name: {{ include "demo-app.fullname" . }}-aws
    kind: SecretStore

  target:
    name: {{ include "demo-app.fullname" . }}-db
    # Owner, so deleting this ExternalSecret takes the credential with it.
    creationPolicy: Owner

  # RDS stores the credential as JSON. property picks out single fields; dataFrom
  # would copy the whole document.
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecret.remoteSecretName | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.remoteSecretName | quote }}
        property: password
{{- end }}