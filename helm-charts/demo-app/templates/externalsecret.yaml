{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "demo-app.fullname" . }}-db
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  # How often the remote value is re-read. Short enough that a rotation
  # propagates without intervention, long enough not to bill a Secrets Manager
  # call every few seconds.
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}

  secretStoreRef:
    name: {{ include "demo-app.fullname" . }}-aws
    kind: SecretStore

  target:
    name: {{ include "demo-app.fullname" . }}-db
    # Owner: External Secrets creates the Secret and deletes it when this
    # resource goes away, so no orphaned credential is left behind.
    creationPolicy: Owner

  # RDS stores the credential as a JSON document. property extracts one field
  # per key, producing a Secret with flat keys the Deployment references
  # directly. The alternative, dataFrom, would copy the whole document
  # including fields the application has no use for.
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecret.remoteSecretName | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.remoteSecretName | quote }}
        property: password
{{- end }}