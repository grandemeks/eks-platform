# Chart defaults. Per-environment overrides: argocd/configs/demo-app/values-<env>.yaml.

replicaCount: 2

image:
  repository: ""
  # Both written by CI. Digest wins over tag when set.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  port: 80

# Connection details, not credentials. Populated from Terraform outputs.
database:
  host: ""
  port: 5432
  name: demo
  # RDS parameter group sets rds.force_ssl=1; the server rejects plaintext.
  sslMode: require

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # No CPU limit. CFS quota throttles for the rest of each 100ms period, which
    # reads as application tail latency; the request already guarantees a share.
    memory: 128Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Must exceed the app's shutdown: 5s failing readiness, then up to 15s draining.
terminationGracePeriodSeconds: 30

ingress:
  enabled: false
  host: ""
  certificateArn: ""

externalSecret:
  enabled: false
  region: eu-central-1
  remoteSecretName: ""
  refreshInterval: 1h
  # Service account in this namespace that External Secrets impersonates.
  serviceAccountName: demo-app-secrets
  roleArn: ""

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s

# Appended to the environment the chart always sets.
extraEnv: []

# SLO targets as values, so prod can be stricter than dev without a chart change.
slo:
  # 99.5% availability over 30 days.
  errorBudget: 0.005

  # Google SRE workbook rates. 14.4/1h and 6/6h page; 3/1d and 1/3d ticket.
  # At rate 1 the budget lasts exactly the 30-day window.
  pageFastBurnRate: 14.4
  pageSlowBurnRate: 6
  ticketFastBurnRate: 3
  ticketSlowBurnRate: 1

  # 99% under 250ms. The app's histogram has a bucket boundary exactly at 0.25,
  # so the SLI is counted rather than interpolated.
  latencyObjectiveSeconds: 0.25
  latencyErrorBudget: 0.01

prometheusRule:
  enabled: false

dashboard:
  enabled: false