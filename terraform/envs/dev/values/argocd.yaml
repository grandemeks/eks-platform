# Argo CD is installed by Terraform, so its values live here and not in
# argocd/configs/ with the components Argo manages itself.

global:
  # Two nodes: hard anti-affinity would leave replicas unschedulable.
  affinity:
    podAntiAffinity: soft

crds:
  install: true
  # false, so uninstalling the release also deletes every Application object
  # with the CRD. Acceptable only because terraform destroy takes the whole
  # cluster; set true if this cluster ever outlives a helm uninstall.
  keep: false

configs:
  params:
    # TLS terminates at the ALB; the remaining hop is inside the VPC. Without
    # this the server double-terminates and the ALB health check fails.
    server.insecure: true

  cm:
    # The label method writes app.kubernetes.io/instance, which collides with
    # the same label set by Helm charts and produces phantom OutOfSync states.
    application.resourceTrackingMethod: annotation

    # Or Argo fights the HPA over spec.replicas.
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jqPathExpressions:
        - .spec.replicas

controller:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

applicationSet:
  # Unused so far; this is how a second environment would be added.
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

notifications:
  # Alertmanager owns alerting; a second path means two places to look.
  enabled: false

dex:
  # No SSO provider, so this would be an unused authentication surface.
  enabled: false

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi