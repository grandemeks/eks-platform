# Sized for two t3.large nodes, not the chart defaults.

fullnameOverride: kube-prometheus-stack

# --- Prometheus ---------------------------------------------------------------
prometheus:
  prometheusSpec:
    # 7d because the 3d burn-rate window needs data. Longer means Thanos or Mimir on S3.
    retention: 7d
    retentionSize: 18GB

    # At the default true, the operator only adopts ServiceMonitors and rules carrying
    # its own release label, and reports nothing about the ones it skips.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    # Storage for the histogram exemplars the app emits; Grafana links them into Tempo.
    enableFeatures:
      - exemplar-storage
    # Tempo's generator remote-writes span metrics and the service graph here.
    # Without this it retries forever and no service graph appears.
    enableRemoteWriteReceiver: true

    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# --- Alertmanager -------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 192Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    route:
      # One notification per incident, not one per pod.
      groupBy: ["alertname", "service"]
      groupWait: 30s
      groupInterval: 5m
      repeatInterval: 4h
      receiver: default

      routes:
        # Matched on severity, not alert name, so new alerts inherit the routing.
        - matchers: ["severity = critical"]
          receiver: pager
          repeatInterval: 1h
        - matchers: ["severity = warning"]
          receiver: default
          repeatInterval: 24h

    receivers:
      # Null receivers here; PagerDuty and Slack in production. The routing
      # tree above is the part being exercised.
      - name: default
      - name: pager

    inhibitRules:
      # One incident would otherwise page and ticket for the same service.
      - sourceMatchers: ["severity = critical"]
        targetMatchers: ["severity = warning"]
        equal: ["service"]

# --- Grafana ------------------------------------------------------------------
grafana:
  # From Secrets Manager. Leaving adminPassword unset has the chart call randAlphaNum
  # on every Argo render, while Grafana keeps the first-install password in its own
  # database: the Secret churns, Grafana restarts, and nobody can log in.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Upstream chart, so the SecretStore/ExternalSecret/ServiceAccount trio goes here.
  extraObjects:
    # Only External Secrets uses this. Grafana's own SA carries no AWS identity.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: grafana-secrets
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::385291933614:role/eks-platform-dev-grafana-secrets

    # Namespaced, not ClusterSecretStore: reachable only from monitoring.
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      metadata:
        name: grafana-aws
      spec:
        provider:
          aws:
            service: SecretsManager
            region: eu-central-1
            auth:
              jwt:
                serviceAccountRef:
                  name: grafana-secrets

    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: grafana-admin
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: grafana-aws
          kind: SecretStore
        target:
          name: grafana-admin
          creationPolicy: Owner
        # Name, not ARN: Terraform creates this one, so there is no random suffix.
        data:
          - secretKey: admin-user
            remoteRef:
              key: eks-platform-dev-grafana-admin
              property: admin-user
          - secretKey: admin-password
            remoteRef:
              key: eks-platform-dev-grafana-admin
              property: admin-password

  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi

  # Lets the app chart ship its dashboard as a labelled ConfigMap.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true

      # Makes the exemplar dots clickable into Tempo. Applies to the Prometheus
      # datasource the chart creates, so it cannot live under additionalDataSources.
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        # Must match the label the app emits (trace_id), not Grafana's default traceID.
        traceIdLabelName: trace_id
        urlDisplayLabel: View trace

  grafana.ini:
    server:
      root_url: https://grafana.incode-demo.grandemeks.tech
    users:
      viewers_can_edit: false
    auth.anonymous:
      enabled: false

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:385291933614:certificate/19d20204-58a8-4fb6-b70c-049295d1a4bb
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      # Same ALB as the app via IngressGroup, instead of a second at $0.023/h.
      alb.ingress.kubernetes.io/group.name: eks-platform-dev
      external-dns.alpha.kubernetes.io/hostname: grafana.incode-demo.grandemeks.tech
    hosts:
      - grafana.incode-demo.grandemeks.tech
      
  # Provisioned, not clicked in: a hand-made datasource dies with the volume.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        # Log-to-trace link. Regex over the line, not matcherType: label: the filelog
        # receiver ships each CRI line as an opaque string, so the app's JSON trace_id
        # never becomes a label. 32 hex chars is a W3C ID and skips truncated fields.
        derivedFields:
          - name: TraceID
            matcherType: regex
            matcherRegex: '"trace_id":"([a-f0-9]{32})"'
            url: "$${__value.raw}"
            datasourceUid: tempo

    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      # 3200, not 3100. 3100 is Loki's port and is not open on the Tempo service.
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        # Span to that pod's logs in the same window.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags:
            - key: service.name
              value: service_name
          filterByTraceID: true

        # Span to the RED metrics Tempo's generator writes.
        tracesToMetrics:
          datasourceUid: prometheus
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags:
            - key: service.name
              value: service

        # Service graph, derived from span parent-child edges.
        serviceMap:
          datasourceUid: prometheus

        nodeGraph:
          enabled: true 
  

# --- Exporters ----------------------------------------------------------------
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# --- Components EKS does not expose -------------------------------------------
# AWS manages the control plane, so these have no endpoints. Left enabled, each
# fires a permanent "target down".
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false