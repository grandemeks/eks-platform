installCRDs: true

crds:
  # v1beta1 is deprecated and its serving is removed on 2026-05-01. Explicitly
  # left off: writing v1 resources from the start avoids a forced migration.
  unsafeServeV1Beta1: false

serviceAccount:
  create: true
  name: external-secrets
  # No IRSA annotation. The operator holds no AWS permissions of its own; each
  # namespace supplies its own identity through the service account its
  # SecretStore references.

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 192Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi