installCRDs: true

crds:
  # v1beta1 is deprecated and its serving is removed on 2026-05-01. Explicitly
  # left off: writing v1 resources from the start avoids a forced migration.
  unsafeServeV1Beta1: false

serviceAccount:
  create: true
  name: external-secrets
  annotations:
    # Scoped to one Secrets Manager ARN and one KMS key, with a ViaService
    # condition. If this identity leaked it could read one database password
    # and could not enumerate anything else in the account.
    eks.amazonaws.com/role-arn: arn:aws:iam::385291933614:role/eks-platform-dev-external-secrets

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 192Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi