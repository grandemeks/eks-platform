installCRDs: true

crds:
  # v1beta1 serving is removed 2026-05-01; write v1 resources from the start.
  unsafeServeV1Beta1: false

serviceAccount:
  create: true
  name: external-secrets
  # No IRSA: each namespace supplies its own identity through its SecretStore.

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 192Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi