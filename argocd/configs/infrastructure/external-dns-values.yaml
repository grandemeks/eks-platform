provider:
  name: aws

serviceAccount:
  create: true
  name: external-dns
  annotations:
    # Role allows ChangeResourceRecordSets on the delegated zone only.
    eks.amazonaws.com/role-arn: arn:aws:iam::385291933614:role/eks-platform-dev-external-dns

# Guard rail in front of the IAM policy, which is the real boundary.
domainFilters:
  - incode-demo.grandemeks.tech

# sync, not upsert-only: upsert-only never deletes, so a removed Ingress leaves
# a record pointing at a dead ALB for the next environment to inherit.
policy: sync

# external-dns only touches records whose ownership TXT carries this ID.
txtOwnerId: eks-platform-dev

# Trailing dot puts the ownership TXT inside the delegated zone. Without it the apex's
# TXT is cname-incode-demo.grandemeks.tech, a sibling in the registrar-hosted parent
# that domainFilters drops, so external-dns stops owning the apex while logging "All
# records are already up to date". Changing this later orphans the old TXT records.
txtPrefix: "%{record_type}-."

sources:
  - ingress

# Fast enough that a teardown clears records, slow enough for the Route53 API.
interval: 1m

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi