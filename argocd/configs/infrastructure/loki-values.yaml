# Single binary on a local volume. The default split read/write/backend mode is
# roughly six times the footprint two t3.large nodes have spare; moving to it plus
# S3 is a values change, not a redesign.
deploymentMode: SingleBinary

loki:
  # Enabling this requires an X-Scope-OrgID header on every write and query.
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      # Current schema, so no migration to schedule at a period boundary later.
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    # Default cap rejects OTLP entries carrying trace/span IDs and resource attributes.
    max_structured_metadata_size: 256KB
    per_stream_rate_limit: 512KB
    per_stream_rate_limit_burst: 1MB

    # Matches Prometheus. The 3d burn-rate alert needs logs from that window.
    retention_period: 168h

    reject_old_samples: true
    reject_old_samples_max_age: 24h

  compactor:
    working_directory: /var/loki/compactor
    delete_request_store: filesystem
    # Without this, retention_period above is not enforced and the volume fills.
    retention_enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi

# The chart provisions these by default; on two nodes they sit Pending forever.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Synthetic write/read probe. Worth it in production; here real traffic covers it.
lokiCanary:
  enabled: false

test:
  enabled: false

gateway:
  # In SingleBinary mode there is one component, so the gateway proxies to itself.
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false