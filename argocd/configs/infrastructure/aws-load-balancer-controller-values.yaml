clusterName: eks-platform-dev

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    # Must match the IRSA trust condition exactly: the role trusts only
    # kube-system/aws-load-balancer-controller.
    eks.amazonaws.com/role-arn: arn:aws:iam::385291933614:role/eks-platform-dev-aws-load-balancer-controller

region: eu-central-1
vpcId: vpc-062635b40d1a2ccd6

# Two replicas so a node drain does not stop Ingress reconciliation.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 192Mi

# Subnets are discovered through the kubernetes.io/role/elb tags applied by the
# network module. Listing them here would duplicate that knowledge and drift
# the moment the VPC changes.