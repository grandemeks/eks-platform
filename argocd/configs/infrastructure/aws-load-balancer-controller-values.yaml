clusterName: eks-platform-dev

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    # IRSA trust policy names kube-system/aws-load-balancer-controller only.
    eks.amazonaws.com/role-arn: arn:aws:iam::385291933614:role/eks-platform-dev-aws-load-balancer-controller

region: eu-central-1
vpcId: vpc-006165e2af4a81868

# A node drain must not stop Ingress reconciliation.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 192Mi

# Subnets come from the kubernetes.io/role/elb tags the network module applies.