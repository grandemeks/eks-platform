# One DaemonSet doing logs and traces. The filelog receiver reads /var/log/pods off
# the host, so DaemonSet is forced anyway. Agent-plus-gateway earns its keep once you
# need tail sampling or a single vendor egress; here it is two hops and double memory.

mode: daemonset

image:
  # The core image has no k8sattributes processor and no OTLP-to-Loki path.
  repository: otel/opentelemetry-collector-contrib

fullnameOverride: otel-collector

presets:
  # Wires up the filelog receiver and CRI parsing; replaces Promtail or Alloy.
  logsCollection:
    enabled: true
    includeCollectorLogs: false

  # Without it a Loki line carries a filename and nothing else.
  kubernetesAttributes:
    enabled: true

  # kube-state-metrics and node-exporter already cover these, and two sources
  # for one metric disagree at the margins.
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false
  clusterMetrics:
    enabled: false

ports:
  otlp:
    enabled: true
    containerPort: 4317
    hostPort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    hostPort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  # Own telemetry on 8888. Required by the PodMonitor below, which otherwise
  # has no container port to scrape.
  metrics:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi

# PodMonitor, not ServiceMonitor: in daemonset mode the chart renders no Service, so
# serviceMonitor.enabled is accepted and does nothing. A Service would also scrape one
# arbitrary collector per interval. Watch otelcol_exporter_send_failed_spans.
podMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
      interval: 30s

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    # First in every pipeline. Otherwise a burst OOMs the collector and takes
    # everything in flight with it; shedding load is the better failure mode.
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 20

    # Last before the exporters; largest single factor in backend load.
    batch:
      timeout: 5s
      send_batch_size: 4096
      send_batch_max_size: 8192

    # A 404 left as an error counts against the SLO error rate.
    transform/unset_404:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - set(status.code, STATUS_CODE_UNSET) where attributes["http.response.status_code"] == 404

  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
      # A Tempo restart should delay traces, not drop them.
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
      sending_queue:
        enabled: true
        queue_size: 1000

    otlphttp/loki:
      # Loki 3.x native OTLP. Resource attributes become stream labels, the
      # rest structured metadata.
      endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
      tls:
        insecure: true
      retry_on_failure:
        enabled: true
      sending_queue:
        enabled: true
        queue_size: 1000

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]

    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, transform/unset_404, batch]
        exporters: [otlp/tempo]

      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/loki]

      # Prometheus scrapes app metrics directly; routing them here renames them to
      # OTel conventions and breaks every SLO rule. Explicit null, because a Helm
      # map merge cannot delete a key by omitting it: the chart's default metrics
      # pipeline stays alive and prints to debug, which filelog then ships to Loki.
      metrics: null