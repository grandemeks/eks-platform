# Dev overrides. CI rewrites the image block; the database and secret references
# come from Terraform outputs and change on every destroy/apply.

image:
  repository: 385291933614.dkr.ecr.eu-central-1.amazonaws.com/eks-platform/demo-app
  tag: "74bff33"
  # Digest is what deploys; the tag feeds the version label on metrics.
  digest: "sha256:a62403898036b9f7654a05d5ac21a6f2c2b5cbdda24c9e547d62eb49e16242ab"

database:
  host: "eks-platform-dev.cty0csq288gi.eu-central-1.rds.amazonaws.com"
  port: 5432
  name: demo
  sslMode: require

externalSecret:
  enabled: true
  region: eu-central-1
  # Full ARN, not the name. The six-character suffix is not part of the name,
  # so it cannot be derived, and it changes on every rebuild.
  remoteSecretName: "arn:aws:secretsmanager:eu-central-1:385291933614:secret:rds!db-68180c48-80b0-41fd-ba4a-c21b4597f8c1-COJ1PC"
  roleArn: "arn:aws:iam::385291933614:role/eks-platform-dev-demo-app-secrets"

ingress:
  enabled: true
  host: incode-demo.grandemeks.tech
  # ACM cert from the persistent bootstrap stack, so it survives rebuilds.
  certificateArn: "arn:aws:acm:eu-central-1:385291933614:certificate/19d20204-58a8-4fb6-b70c-049295d1a4bb"
  group: eks-platform-dev

# Off in the chart defaults so a bare helm install does not fail on missing CRDs.
serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true

dashboard:
  enabled: true


extraEnv:
  # hostIP reaches the collector's hostPort on this pod's own node.
  - name: OTEL_COLLECTOR_HOST
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP

  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://$(OTEL_COLLECTOR_HOST):4318"

  # Becomes service.name, which Tempo groups by and names service-graph nodes after.
  - name: OTEL_SERVICE_NAME
    value: demo-app

  - name: OTEL_DEPLOYMENT_ENVIRONMENT
    value: dev