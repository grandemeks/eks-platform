# Environment overrides for dev.
#
# The image block is rewritten by CI on every successful build. The database
# and secret references come from Terraform outputs and change whenever the
# environment is recreated — RDS generates a new Secrets Manager secret each
# time, so its ARN is not stable across a destroy/apply cycle.

image:
  repository: 385291933614.dkr.ecr.eu-central-1.amazonaws.com/eks-platform/demo-app
  tag: "410b783"
  # The digest is what actually gets deployed. The tag stays for humans and
  # for the version label on metrics.
  digest: "sha256:de83581c18c095922f3c382a55117c0107cd1016984b41275f747c6a57e351f2"

database:
  host: "eks-platform-dev.cty0csq288gi.eu-central-1.rds.amazonaws.com"
  port: 5432
  name: demo
  sslMode: require

externalSecret:
  enabled: true
  region: eu-central-1
  # Full ARN, not the name. Secrets Manager appends a random six-character
  # suffix to the ARN that is not part of the secret's name, so deriving one
  # from the other produces a value that does not resolve.
  remoteSecretName: "arn:aws:secretsmanager:eu-central-1:385291933614:secret:rds!db-cbf47923-22a1-42c4-aefb-4862a0f168f8-gCEJSv"
  roleArn: "arn:aws:iam::385291933614:role/eks-platform-dev-demo-app-secrets"

ingress:
  enabled: true
  host: incode-demo.grandemeks.tech
  # Issued by ACM in the bootstrap layer, validated through the delegated
  # Route53 zone. Stable across environment rebuilds because it lives in the
  # persistent stack.
  certificateArn: "arn:aws:acm:eu-central-1:385291933614:certificate/19d20204-58a8-4fb6-b70c-049295d1a4bb"
  group: eks-platform-dev

# ---------------------------------------------------------------------------
# APPEND / MERGE into argocd/configs/demo-app/values-dev.yaml
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true

dashboard:
  enabled: true


extraEnv:
  # The collector runs as a DaemonSet with hostPort, so the pod reaches the one
  # on its own node rather than crossing to another. That keeps the export hop
  # local, and it means a node losing its collector affects only the pods on
  # that node instead of the whole cluster losing traces.
  - name: OTEL_COLLECTOR_HOST
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP

  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://$(OTEL_COLLECTOR_HOST):4318"

  # Becomes service.name on every span. This is what Tempo groups by and what
  # the nodes on the service graph are named after.
  - name: OTEL_SERVICE_NAME
    value: demo-app

  - name: OTEL_DEPLOYMENT_ENVIRONMENT
    value: dev