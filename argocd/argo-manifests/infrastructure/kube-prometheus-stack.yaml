apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Wave 1: the app's ServiceMonitor and PrometheusRule need these CRDs first.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 89.2.0
      helm:
        valueFiles:
          - $values/argocd/configs/infrastructure/kube-prometheus-stack-values.yaml
        # CRDs are applied, not skipped. They exceed the 262kB annotation limit
        # client-side apply uses, so ServerSideApply below is mandatory.
        skipCrds: false

    - repoURL: https://github.com/grandemeks/eks-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Mandatory here: the operator CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m