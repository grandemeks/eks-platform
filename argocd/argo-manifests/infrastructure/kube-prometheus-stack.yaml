apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Wave 1: after the controllers, before the application. The demo app's
    # ServiceMonitor and PrometheusRule need these CRDs to already exist.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 89.2.0
      helm:
        valueFiles:
          - $values/argocd/configs/infrastructure/kube-prometheus-stack-values.yaml
        # The Prometheus operator CRDs exceed the 262kB annotation limit that
        # client-side apply uses to store last-applied-configuration. Skipping
        # them here and relying on ServerSideApply below is what keeps the sync
        # from failing on the CRDs alone.
        skipCrds: false

    - repoURL: https://github.com/grandemeks/eks-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required, not optional, for this chart: server-side apply stores the
      # field manager on the server instead of in an annotation, so the large
      # CRDs go through.
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m