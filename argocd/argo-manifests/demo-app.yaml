apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  annotations:
    # After the wave 0 controllers, so the SecretStore has an operator.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Multi-source: a single-source Application resolves valueFiles relative to
  # its own path and refuses to escape it.
  sources:
    - repoURL: https://github.com/grandemeks/eks-platform.git
      targetRevision: main
      path: helm-charts/demo-app
      helm:
        valueFiles:
          # $values is the root of the ref source below, so this is a repo-root path.
          - $values/argocd/configs/demo-app/values-dev.yaml

    - repoURL: https://github.com/grandemeks/eks-platform.git
      targetRevision: main
      # Value files only; no path, so no manifests come from this source.
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    # The chart does not own the namespace, so PSA labels are set here.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m