apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ .Values.destination.namespace }}
  # Without the finalizer, deleting this orphans every child Application.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ required "repoURL must be set" .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ .Values.path | quote }}
    directory:
      # Child Applications live in subdirectories.
      recurse: true

  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.destination.namespace }}

  syncPolicy:
    automated:
      # Without prune, a component deleted from Git keeps running.
      prune: true
      # Reverts manual kubectl edits.
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      # The Prometheus operator CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m