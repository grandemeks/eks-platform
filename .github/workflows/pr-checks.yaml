name: pr checks

# Read-only by design: no apply path. Applies live in environment.yaml, which has
# no pull_request trigger. Keep it that way; do not add apply steps here.
on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'helm-charts/**'
      - 'argocd/configs/**'
      - 'app/**'
      - '.github/workflows/pr-checks.yaml'

permissions:
  contents: read
  id-token: write        # OIDC, so plan can read AWS state
  pull-requests: write   # to post the plan as a comment

concurrency:
  # A new push makes the in-flight plan stale, so cancelling it is correct.
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  TF_VERSION: "1.13.3"

jobs:
  terraform:
    name: terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest

    strategy:
      # Both stacks report, so a reviewer sees every failure in one run.
      fail-fast: false
      matrix:
        stack: [bootstrap, envs/dev]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Required: steps.plan.outputs.stdout only exists with the wrapper.
          terraform_wrapper: true

      # OIDC, no static keys. The role ARN is a repository variable, not a secret:
      # it is useless without the trust policy that pins it to this repository.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: terraform fmt
        id: fmt
        working-directory: terraform/${{ matrix.stack }}
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: terraform init
        working-directory: terraform/${{ matrix.stack }}
        run: terraform init -input=false

      - name: terraform validate
        id: validate
        working-directory: terraform/${{ matrix.stack }}
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        id: tflint
        working-directory: terraform/${{ matrix.stack }}
        run: |
          tflint --init
          tflint --format compact --recursive
        continue-on-error: true

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: terraform/${{ matrix.stack }}
          severity: HIGH,CRITICAL
          exit-code: '0'   # advisory here; findings belong in the review
          format: table

      - name: terraform plan
        id: plan
        working-directory: terraform/${{ matrix.stack }}
        run: terraform plan -input=false -no-color -lock-timeout=5m
        continue-on-error: true

      - name: Comment the plan on the pull request
        uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.stack }}
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const stack = process.env.STACK;
            // GitHub rejects comments over 65536 chars; truncate rather than fail.
            const raw = process.env.PLAN || '(no output)';
            const plan = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n... truncated, see the workflow run'
              : raw;

            const marker = `### Terraform plan: \`${stack}\``;
            const body = [
              marker, '',
              '| check | result |', '| --- | --- |',
              `| fmt | \`${{ steps.fmt.outcome }}\` |`,
              `| validate | \`${{ steps.validate.outcome }}\` |`,
              `| tflint | \`${{ steps.tflint.outcome }}\` |`,
              `| plan | \`${{ steps.plan.outcome }}\` |`,
              '', '<details><summary>Plan output</summary>', '',
              '```terraform', plan, '```', '', '</details>',
            ].join('\n');

            // Update this stack's comment in place instead of adding one per push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # fmt and plan block the merge; tflint and Trivy stay advisory on purpose.
      - name: Fail on plan or formatting errors
        if: steps.plan.outcome == 'failure' || steps.fmt.outcome == 'failure'
        run: exit 1

  helm:
    name: helm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: helm lint
        run: |
          helm lint helm-charts/demo-app \
            -f argocd/configs/demo-app/values-dev.yaml

      # lint is not enough: a missing required value only fails at template time,
      # and in production that surfaces as an Argo Application in ComparisonError.
      - name: helm template
        run: |
          helm template demo-app helm-charts/demo-app \
            -f argocd/configs/demo-app/values-dev.yaml \
            --namespace demo > /tmp/rendered.yaml
          echo "Rendered objects:"
          grep -E '^kind:' /tmp/rendered.yaml | sort | uniq -c

      # Scans the rendered output above, so it needs the helm template step first.
      - name: Trivy manifest scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered.yaml
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table

  secrets:
    name: secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans history, not the final tree: a secret added and then
          # removed in a later commit is still leaked.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}