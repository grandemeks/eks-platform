name: app release

# Ends with a commit, not a deploy: this workflow holds no cluster credentials.
# Argo CD reconciles from the committed values file.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-release.yaml'
  workflow_dispatch:

permissions:
  contents: write   # to commit the updated image reference
  id-token: write   # OIDC, for both AWS and keyless signing

concurrency:
  group: app-release
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 385291933614.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: eks-platform/demo-app
  VALUES_FILE: argocd/configs/demo-app/values-dev.yaml

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for the push-back at the end; relies on permissions.contents: write.
          persist-credentials: true

      - name: Derive image tag
        id: meta
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Scan the source before building: a bad go.mod fails in 30s, not after a
      # 5-minute build, and the finding names a file rather than a layer digest.
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # a CVE with no fix is not actionable here
          exit-code: '1'
          format: table

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Not the Terraform role: this scopes to one ECR repo and one KMS key.
          role-to-assume: ${{ vars.AWS_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-release-${{ github.run_id }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build with push:false so the image is scanned before it is pullable.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Base is distroless static, so anything reported here comes from our layer.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # For CVE triage later: answers which builds contain an affected package.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Push image
        run: docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.meta.outputs.tag }}"

      - name: Resolve image digest
        id: digest
        run: |
          # Deploy by digest, not tag: a cosign signature covers a digest.
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ steps.meta.outputs.tag }}" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Digest: $DIGEST"

      # Keyless: signing identity is this workflow's OIDC token, so there is no
      # private key to store or rotate. Nothing in the cluster verifies these
      # signatures yet; a Kyverno verifyImages policy is the intended consumer.
      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        run: |
          cosign sign --yes \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}@${{ steps.digest.outputs.digest }}"

      - name: Attach SBOM as an attestation
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}@${{ steps.digest.outputs.digest }}"

      # In-place line rewrite, not a yq round-trip: that would strip the file's comments.
      - name: Update the image reference in Git
        run: |
          python3 - "$VALUES_FILE" "${{ steps.meta.outputs.tag }}" "${{ steps.digest.outputs.digest }}" <<'PYEOF'
          import re, sys
          path, tag, digest = sys.argv[1:4]
          src = open(path).read()
          for key, value in (("tag", tag), ("digest", digest)):
              pattern = re.compile(r'^(\s*)%s:[ \t]*\S.*$' % key, re.MULTILINE)
              src, n = pattern.subn(lambda m: '%s%s: "%s"' % (m.group(1), key, value), src, count=1)
              if n == 0:
                  sys.exit("key %s not found in %s" % (key, path))
          open(path, "w").write(src)
          PYEOF
          git --no-pager diff -- "$VALUES_FILE"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          if git diff --cached --quiet; then
            echo "Image reference unchanged, nothing to commit."
            exit 0
          fi
          # [skip ci] is load-bearing: without it this push retriggers the workflow and loops.
          git commit -m "chore(release): demo-app ${{ steps.meta.outputs.tag }} [skip ci]"
          git push

      - name: Summary
        run: |
          {
            echo "### Released demo-app \`${{ steps.meta.outputs.tag }}\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| digest | \`${{ steps.digest.outputs.digest }}\` |"
            echo "| dependency scan | passed |"
            echo "| image scan | passed |"
            echo "| SBOM | attached as attestation |"
            echo "| signature | keyless, recorded in Rekor |"
            echo
            echo "Argo CD reconciles from the committed values file. This job never touched the cluster."
          } >> "$GITHUB_STEP_SUMMARY"