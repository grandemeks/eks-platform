name: environment

# The only workflow that applies infrastructure. Do not add a pull_request
# trigger: plans live in pr-checks.yaml, which has no apply path, so a bad `if:`
# here cannot reach an apply. That is a guard rail only. GitHub runs the head
# branch's workflow file on pull_request and the CI role's trust policy accepts
# it, so branch protection plus the required reviewer below are the real control.
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/environment.yaml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Bring the environment up or tear it down'
        required: true
        type: choice
        options: [up, down]
      confirm:
        description: 'Type the environment name to confirm (eks-platform-dev)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # Never cancel in flight: an apply must not overlap a destroy on the same state.
  group: environment
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_VERSION: "1.13.3"
  CLUSTER_NAME: eks-platform-dev

jobs:
  environment:
    runs-on: ubuntu-latest

    # Carries a required reviewer; without it a merge to main applies unattended.
    environment: dev

    steps:
      # workflow_dispatch has no undo and the down path deletes a database.
      - name: Verify confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "$CLUSTER_NAME" ]; then
            echo "Confirmation did not match '$CLUSTER_NAME'. Refusing to proceed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref, workflow, event_name}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-env-${{ github.run_id }}

      # Must precede the env stack: that stack looks up the KMS key and certificate
      # bootstrap owns. No-op on a normal change.
      - name: Apply bootstrap
        if: github.event_name == 'push' || inputs.action == 'up'
        working-directory: terraform/bootstrap
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -lock-timeout=10m

      - name: Apply dev environment
        if: github.event_name == 'push' || inputs.action == 'up'
        working-directory: terraform/envs/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -lock-timeout=10m

      # A rebuild changes the RDS secret ARN, VPC id and IRSA role ARNs. Argo reads
      # those from Git, so the app cannot reconcile until they are synced and
      # committed. Printed here so the required manual step is not silent.
      - name: Report values that need syncing
        if: github.event_name == 'push' || inputs.action == 'up'
        working-directory: terraform/envs/dev
        run: |
          {
            echo "### Environment is up"
            echo
            echo "Run \`scripts/sync-values.sh\` locally and commit if these differ from \`argocd/configs\`:"
            echo
            echo '```'
            terraform output -raw database_endpoint   && echo
            terraform output -raw database_secret_arn && echo
            terraform output -raw vpc_id              && echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The script, not a bare terraform destroy: it drains the Kubernetes objects
      # that own AWS resources Terraform cannot see. See scripts/teardown.sh.
      - name: Tear the environment down
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'down'
        run: ./scripts/teardown.sh -auto-approve

      - name: Confirm nothing is left running
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'down'
        run: |
          {
            echo "### Environment torn down"
            echo
            echo '```'
            echo "clusters:       $(aws eks list-clusters --query 'clusters' --output text)"
            echo "vpcs:           $(aws ec2 describe-vpcs --query 'Vpcs[?!IsDefault].VpcId' --output text)"
            echo "load balancers: $(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerName' --output text)"
            echo "volumes:        $(aws ec2 describe-volumes --filters Name=status,Values=available --query 'Volumes[].VolumeId' --output text)"
            echo "rds:            $(aws rds describe-db-instances --query 'DBInstances[].DBInstanceIdentifier' --output text)"
            echo '```'
            echo
            echo "Empty values mean nothing is billing. The bootstrap layer stays up by design:"
            echo "state bucket, KMS key, DNS zone, ECR, certificate, CI roles: about \$1.50/month."
          } >> "$GITHUB_STEP_SUMMARY"